# Fly.io app (org: pete / pete-868). PocketBase data lives on the pb_data volume.
# Required secrets: PB_SUPERUSER_EMAIL, PB_SUPERUSER_PASSWORD (see docs/fly-deploy.md).

app = 'aquarium-3d0uzq'
primary_region = 'ams'

[build]

[env]
  HOST = '0.0.0.0'
  NODE_ENV = 'production'
  PB_DATA = '/data/pb_data'
  PORT = '8080'

[[mounts]]
  source = 'pb_data'
  destination = '/data'
  initial_size = '1gb'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '15s'
    timeout = '5s'
    grace_period = '30s'
    method = 'GET'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
