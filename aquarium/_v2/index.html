<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f2238">
  <meta name="description" content="FISH IN SPACE!: breed pixel fish in an orbital hatchery and seed the oceans of a newly terraformed planet.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="manifest" href="./manifest.webmanifest">
  <title>FISH IN SPACE!</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800&family=Pixelify+Sans:wght@500;700&display=swap">
  <link rel="stylesheet" href="./style.css">
  <link rel="modulepreload" href="./js/world.js">
</head>
<body>
  <div class="app">
    <header class="hud">
      <div class="brand"><span class="logo" aria-hidden="true">&#x2604;</span><div><b>FISH IN SPACE!</b><small>Orbital Hatchery <i>Minnow</i></small></div></div>
      <div class="hud-right">
        <div class="pill bloom-pill" title="Bloom: how alive Mirelle is">
          <span class="phase" id="phaseName">First Thaw</span>
          <span class="bar"><i id="bloomFill"></i></span>
          <span class="num" id="bloomText">0/120</span>
        </div>
        <div class="pill credit-pill" title="Credits"><span>&#x25ce;</span> <b id="credits">0</b></div>
        <button class="icon-btn" id="mute" data-act="mute" aria-label="Sound" aria-pressed="true">&#x266a;</button>
      </div>
    </header>

    <main class="stage">
      <section class="tank-wrap">
        <div class="tank-frame"><canvas id="tank" tabindex="0" aria-label="The hatchery tank. Tap a fish to inspect it, tap water to drop feed."></canvas></div>
        <div class="tank-top">
          <span class="berths" id="berths">0/10 berths</span>
          <button class="btn small ghost" data-act="feed-all" title="Feed everyone (F)">&#x273f; Feed all</button>
        </div>
        <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
        <div class="hint-row"><span class="hint" id="hint" hidden></span><button class="btn small" id="cancelPair" data-act="cancel-pair" hidden>Cancel</button></div>
      </section>

      <section class="panel">
        <nav class="tabs" role="tablist">
          <button role="tab" data-act="tab" data-tab="tank" aria-selected="true"><span>&#x2318;</span>Tank</button>
          <button role="tab" data-act="tab" data-tab="requests"><span>&#x2604;</span>Requests<em id="reqBadge" hidden>0</em></button>
          <button role="tab" data-act="tab" data-tab="exchange"><span>&#x25ce;</span>Exchange</button>
          <button role="tab" data-act="tab" data-tab="vault"><span>&#x2744;</span>Vault</button>
          <button role="tab" data-act="tab" data-tab="mirelle"><span>&#x25d0;</span>Mirelle</button>
          <button role="tab" data-act="tab" data-tab="log"><span>&#x270e;</span>Log</button>
        </nav>
        <div class="pane" data-pane="tank"><div id="rosterBody"></div></div>
        <div class="pane" data-pane="requests" hidden><div id="requestsBody"></div></div>
        <div class="pane" data-pane="exchange" hidden><div id="exchangeBody"></div></div>
        <div class="pane" data-pane="vault" hidden><div id="vaultBody"></div></div>
        <div class="pane" data-pane="mirelle" hidden>
          <div class="planet-box"><canvas id="planet" aria-label="The planet Mirelle"></canvas></div>
          <div id="mirelleBody"></div>
        </div>
        <div class="pane" data-pane="log" hidden><div id="logBody"></div></div>
      </section>
    </main>

    <aside class="sheet" id="sheet" hidden aria-label="Fish dossier">
      <button class="icon-btn close" data-act="close" aria-label="Close">&#x2715;</button>
      <div id="sheetBody"></div>
    </aside>

    <div class="modal" id="modal" hidden>
      <div class="modal-card" role="dialog" aria-modal="true">
        <div class="pip" aria-hidden="true"><span></span></div>
        <div id="modalBody"></div>
        <button class="btn big" id="modalGo">OK</button>
      </div>
    </div>
  </div>
  <script type="module" src="./js/main.js"></script>
</body>
</html>
