# One Machine. PocketBase is SQLite on the volume below, so do not scale past one
# (`fly deploy --ha=false`). Two machines cannot share the database file.
# If the app name is taken, change `app` here to match `fly apps create`.

app = "pixelforge"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  HOST = "0.0.0.0"
  APP_PORT = "8080"
  PB_URL = "http://127.0.0.1:8090"
  PB_DATA = "/data/pb_data"
  NODE_ENV = "production"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "30s"
    interval = "15s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[mounts]
  source = "pb_data"
  destination = "/data"
  initial_size = "1gb"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
